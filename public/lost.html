<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Lost Item</title>

<link rel="stylesheet" href="style.css">

<style>

/* small preview */
.preview-img {
    width: 150px;
    margin-top: 10px;
    display: none;
    border-radius: 10px;
    border: 2px solid #8800ff;
    cursor: pointer;
}

/* zoom modal */
.zoom-modal {
    display: none;
    position: fixed;
    top: 0; 
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.zoom-modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
}

</style>

</head>

<body>

<div class="form-container">
    <h2>Report Lost Item</h2>

    <input type="text" id="name" placeholder="Item Name">
    <input type="text" id="category" placeholder="Category">
    <input type="date" id="date">
    <input type="text" id="location" placeholder="Location Lost">
    <input type="text" id="contact" placeholder="Contact Number">

    <input type="file" id="photo" accept="image/*" onchange="previewImage(event)">

    <!-- SMALL PREVIEW -->
    <img id="preview" class="preview-img" onclick="openZoom()">

    <div class="button-stack">
        <button onclick="submitLost()">Submit</button>
        <a href="index.html" class="btn">Back to Home</a>
    </div>
</div>

<!-- ZOOM MODAL -->
<div class="zoom-modal" id="zoomModal" onclick="closeZoom()">
    <img id="zoomImage">
</div>

<script>

const API = "http://localhost:3000";

let currentImage = null;

/* ================= PREVIEW ================= */
function previewImage(event) {
    const file = event.target.files[0];
    const preview = document.getElementById("preview");

    if (file) {
        const url = URL.createObjectURL(file);
        preview.src = url;
        preview.style.display = "block";
        currentImage = url;
    }
}

/* ================= OPEN ZOOM ================= */
function openZoom() {
    if (!currentImage) return;

    const modal = document.getElementById("zoomModal");
    const zoomImg = document.getElementById("zoomImage");

    zoomImg.src = currentImage;
    modal.style.display = "flex";
}

/* ================= CLOSE ZOOM ================= */
function closeZoom() {
    document.getElementById("zoomModal").style.display = "none";
}

/* ================= SUBMIT ================= */
async function submitLost() {

    const formData = new FormData();

    formData.append("name", document.getElementById("name").value);
    formData.append("category", document.getElementById("category").value);
    formData.append("date", document.getElementById("date").value);
    formData.append("location", document.getElementById("location").value);
    formData.append("contact", document.getElementById("contact").value);

    const file = document.getElementById("photo").files[0];
    if (file) formData.append("photo", file);

    const res = await fetch(`${API}/lost`, {
        method: "POST",
        body: formData
    });

    if (res.ok) {
        window.location.href = "success.html";
    } else {
        alert("Error submitting item");
    }
}

</script>

</body>
</html>
