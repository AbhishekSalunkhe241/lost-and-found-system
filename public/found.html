<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report Found Item</title>

<link rel="stylesheet" href="style.css">

<style>

/* SMALL PREVIEW */
.preview-img {
    width: 150px;
    margin-top: 10px;
    display: none;
    border-radius: 10px;
    border: 2px solid #8800ff;
    cursor: pointer;
}

/* ZOOM MODAL */
.zoom-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.zoom-modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 10px;
}

</style>

</head>

<body>

<div class="form-container">
    <h2>Report Found Item</h2>

    <input type="text" id="name" placeholder="Item Name">
    <input type="text" id="category" placeholder="Category">
    <input type="date" id="date">
    <input type="text" id="location" placeholder="Location Found">

    <!-- IMAGE UPLOAD -->
    <input type="file" id="photo" accept="image/*" onchange="previewImage(event)">

    <!-- PREVIEW -->
    <img id="preview" class="preview-img" onclick="openZoom()">

    <div class="button-stack">
        <button onclick="submitFound()">Submit</button>
        <a href="index.html" class="btn">Back to Home</a>
    </div>
</div>

<!-- ZOOM -->
<div class="zoom-modal" id="zoomModal" onclick="closeZoom()">
    <img id="zoomImage">
</div>

<script>

const API = "http://localhost:3000";

let currentImage = null;

/* ================= PREVIEW ================= */
function previewImage(event) {
    const file = event.target.files[0];
    const preview = document.getElementById("preview");

    if (file) {
        const url = URL.createObjectURL(file);
        preview.src = url;
        preview.style.display = "block";
        currentImage = url;
    }
}

/* ================= ZOOM OPEN ================= */
function openZoom() {
    if (!currentImage) return;

    document.getElementById("zoomImage").src = currentImage;
    document.getElementById("zoomModal").style.display = "flex";
}

/* ================= ZOOM CLOSE ================= */
function closeZoom() {
    document.getElementById("zoomModal").style.display = "none";
}

/* ================= SUBMIT FOUND ================= */
async function submitFound() {

    const formData = new FormData();

    formData.append("name", document.getElementById("name").value);
    formData.append("category", document.getElementById("category").value);
    formData.append("date", document.getElementById("date").value);
    formData.append("location", document.getElementById("location").value);

    const file = document.getElementById("photo").files[0];
    if (file) {
        formData.append("photo", file);
    }

    const res = await fetch(`${API}/found`, {
        method: "POST",
        body: formData
    });

    if (res.ok) {
        alert("Found item submitted ✔");
        window.location.href = "index.html";
    } else {
        alert("Error submitting item");
    }
}

</script>

</body>
</html>
